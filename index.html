  <body>
    <div id="root">
      <div
        id="mrv-boot-shell"
        style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#0055A4;color:#fff;font-family:system-ui,sans-serif;padding:1.25rem;text-align:center;box-sizing:border-box"
      >
        <img
          src="/icon-192.png"
          alt=""
          width="96"
          height="96"
          fetchpriority="high"
          decoding="async"
          style="width:96px;height:96px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,0.25)"
        />
        <div style="max-width:22rem">
          <p style="font-weight:700;margin:0;font-size:1rem;line-height:1.35">M R V — PNEI y PAI — MSPBS</p>
          <p id="mrv-boot-status" style="margin:0.5rem 0 0;font-size:0.8125rem;opacity:0.92">Iniciando…</p>
        </div>
        <div
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
          id="mrv-boot-bar"
          style="width:min(280px,88vw);height:6px;border-radius:999px;background:rgba(255,255,255,0.25);overflow:hidden"
        >
          <div
            id="mrv-boot-bar-fill"
            style="height:100%;width:0%;border-radius:999px;background:#fff;transition:width 0.2s ease-out"
          ></div>
        </div>
      </div>
