# MRV — APK + AAB con Capacitor (sin Android Studio local)
name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '24'
  JAVA_VERSION: '21'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Android project in repo
        run: |
          test -f android/gradlew || (echo "Falta android/gradlew — subí la carpeta android/" && exit 1)
          test -f android/build.gradle
          chmod +x android/gradlew

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0

      - name: Setup Gradle (carpeta android/)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: android
          cache-read-only: false

      - name: Install dependencies
        run: npm ci

      - name: Version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MA=$(echo "$VERSION" | cut -d. -f1)
          MI=$(echo "$VERSION" | cut -d. -f2)
          PA=$(echo "$VERSION" | cut -d. -f3)
          CODE=$((MA * 10000 + MI * 100 + PA))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Verify web build output
        run: |
          test -d dist-vite
          test -f dist-vite/index.html

      - name: Capacitor doctor
        run: npx cap doctor || true

      - name: Capacitor sync Android
        run: |
          set -euxo pipefail
          sed -i 's/\r$//' android/gradlew scripts/ci-android-signing.sh scripts/ci-cap-sync.sh 2>/dev/null || true
          chmod +x android/gradlew scripts/ci-android-signing.sh scripts/ci-cap-sync.sh
          bash scripts/ci-cap-sync.sh android

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          sed -i 's/\r$//' scripts/ci-android-signing.sh 2>/dev/null || true
          chmod +x scripts/ci-android-signing.sh
          bash scripts/ci-android-signing.sh

      - name: Build Release APK and AAB
        id: release_build
        continue-on-error: true
        working-directory: android
        run: |
          ./gradlew assembleRelease bundleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            --build-cache \
            --no-daemon

      - name: Build Debug APK
        if: always()
        working-directory: android
        run: ./gradlew assembleDebug --build-cache --no-daemon

      - name: Fail job if no APK was produced
        run: |
          if ! ls android/app/build/outputs/apk/release/*.apk android/app/build/outputs/apk/debug/*.apk mobile-artifacts/*.apk 2>/dev/null | head -1 | grep -q .; then
            echo "::error::No se generó ningún APK. Revisa el log de Gradle arriba."
            exit 1
          fi

      - name: Rename artifacts
        run: |
          mkdir -p mobile-artifacts
          cp android/app/build/outputs/apk/release/app-release.apk "mobile-artifacts/MRV-${VERSION_NAME}-release.apk" 2>/dev/null || true
          cp android/app/build/outputs/bundle/release/app-release.aab "mobile-artifacts/MRV-${VERSION_NAME}-release.aab" 2>/dev/null || true
          cp android/app/build/outputs/apk/debug/app-debug.apk "mobile-artifacts/MRV-${VERSION_NAME}-debug.apk" 2>/dev/null || true
          ls -la mobile-artifacts/ || ls -laR android/app/build/outputs/

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: mrv-android-apk-release-${{ env.VERSION_NAME }}
          path: |
            mobile-artifacts/*-release.apk
            android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: mrv-android-aab-${{ env.VERSION_NAME }}
          path: |
            mobile-artifacts/*-release.aab
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mrv-android-apk-debug-${{ env.VERSION_NAME }}
          path: |
            mobile-artifacts/*-debug.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
