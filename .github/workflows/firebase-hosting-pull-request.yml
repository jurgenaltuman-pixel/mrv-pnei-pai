# Firebase Hosting — preview en PR (solo si hay cuenta de servicio).
name: Deploy to Firebase Hosting on PR

on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FIREBASE_PROJECT_ID: mrv2026
  FIREBASE_HOSTING_TARGET: mrvpai

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Deploy preview channel
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 }}
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.FIREBASE_HOSTING_TARGET }}

      - name: Skip preview (Firebase secret not configured)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 == '' }}
        run: echo "::warning::Preview omitido — falta FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026."
