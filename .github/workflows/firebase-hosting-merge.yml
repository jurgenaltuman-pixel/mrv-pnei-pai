# Firebase Hosting — build siempre; deploy solo si hay cuenta de servicio en secretos.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FIREBASE_PROJECT_ID: mrv2026
  FIREBASE_HOSTING_TARGET: mrvpai

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Deploy Firebase Hosting
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.FIREBASE_HOSTING_TARGET }}

      - name: Skip deploy (Firebase secret not configured)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 == '' }}
        run: |
          echo "::warning::FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 no está en GitHub Secrets."
          echo "Build OK. Para publicar en https://mrvpai.web.app añade el JSON de la cuenta de servicio de Firebase."
