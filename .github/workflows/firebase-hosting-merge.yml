# Firebase Hosting — build en cada push; deploy solo si existe cuenta de servicio.
name: Deploy to Firebase Hosting on merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FIREBASE_PROJECT_ID: mrv2026
  FIREBASE_HOSTING_TARGET: mrvpai

jobs:
  build:
    name: build_and_deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify build secrets (warn only)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ]; then
            echo "::warning::Falta el secreto VITE_SUPABASE_URL. Se continuará con el build usando variables del proyecto."
          fi
          if [ -z "${VITE_SUPABASE_PUBLISHABLE_KEY:-}" ]; then
            echo "::warning::Falta VITE_SUPABASE_PUBLISHABLE_KEY. Se continuará con el build usando variables del proyecto."
          fi
          echo "Verificación completada."

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BUILD_ID: ${{ github.sha }}
        run: npm ci && npm run build

      - name: Upload dist (para deploy)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist-vite
          retention-days: 2

      - name: Aviso si falta deploy a Firebase
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 }}
        run: |
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "::warning::El build se completó. Para publicar en Firebase Hosting, agregá el secreto FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 (JSON de cuenta de servicio: Firebase Console → Project settings → Service accounts → Generate new private key) en GitHub → Settings → Secrets and variables → Actions."
          fi

  deploy:
    needs: build
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist-vite

      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRVPAI_2026 }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT_ID }}
          target: ${{ env.FIREBASE_HOSTING_TARGET }}
